# Issue #105 r3 번들 독립 복원 검증 전용 — PR #111(P1-A~E) 코드용 새 환경 (Qdrant + Neo4j). NEW project/volumes only.
# r3 번들의 compose.yaml로 들어간다 (build_restore_bundle_r3.py가 restore_profiles_v140.R3_ENVIRONMENTS["verify"]["compose"]를 넣음).
# - 이전 verify(issue105-r3-verify, 56656/56687, docs/development/issue105_r3_verify.compose.yaml)는 보존 대상이며 이 파일과 별개다.
#   r3 build(issue105-r3b-build)·#91 원본·r2 검증·공유 DB와도 별도 프로젝트다.
#   볼륨 이름: issue105-r3d-verify_qdrant_storage / _neo4j_data / _neo4j_logs (external·container_name·바인드 마운트 없음)
# - 인증은 이 환경 전용 변수만 쓴다: ISSUE105_R3D_VERIFY_QDRANT_API_KEY, ISSUE105_R3D_VERIFY_NEO4J_PASSWORD.
#   scripts/restore_r3_isolated.py가 같은 변수만 읽고 고정 주소로 restore_final_v140_r3.restore()에 직접 넘긴다.
# - 이미지: Qdrant 1.12.4 / Neo4j Community 5.26.32 (이전 verify·r2와 같은 digest). 포트: Qdrant 127.0.0.1:56756, Bolt 127.0.0.1:56787.
# - 정리에 `down -v`를 쓰지 않는다. 실패한 볼륨은 보존하고 새 프로젝트 이름으로 다시 시작한다.
name: issue105-r3d-verify
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4@sha256:241edb9d7778327516ef218f8c74e1bd61b5ea42cd4f193cb8d0896199705636
    ports:
      - "127.0.0.1:56756:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${ISSUE105_R3D_VERIFY_QDRANT_API_KEY:?Set ISSUE105_R3D_VERIFY_QDRANT_API_KEY in this PowerShell session}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_storage:/qdrant/storage
    mem_limit: 1g
    cpus: 2
    restart: "no"
  neo4j:
    image: neo4j:5.26-community@sha256:42ef3ebfd671ebd01fdebb6dcbe80cf7b45eef2aa3d346ef4132f7ef31e67d2f
    ports:
      - "127.0.0.1:56787:7687"
    environment:
      NEO4J_AUTH: neo4j/${ISSUE105_R3D_VERIFY_NEO4J_PASSWORD:?Set ISSUE105_R3D_VERIFY_NEO4J_PASSWORD in this PowerShell session}
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    mem_limit: 1280m
    cpus: 2
    restart: "no"
volumes:
  qdrant_storage:
  neo4j_data:
  neo4j_logs:
