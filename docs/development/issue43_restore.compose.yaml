# NEW project/volumes only. Supply credentials through process environment.
services:
  qdrant:
    image: qdrant/qdrant@sha256:241edb9d7778327516ef218f8c74e1bd61b5ea42cd4f193cb8d0896199705636
    ports:
      - "127.0.0.1:${FINAL_QDRANT_PORT:-56336}:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_storage:/qdrant/storage
    mem_limit: 512m
  neo4j:
    image: neo4j@sha256:42ef3ebfd671ebd01fdebb6dcbe80cf7b45eef2aa3d346ef4132f7ef31e67d2f
    ports:
      - "127.0.0.1:${FINAL_NEO4J_HTTP_PORT:-57474}:7474"
      - "127.0.0.1:${FINAL_NEO4J_BOLT_PORT:-57687}:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    mem_limit: 1280m
volumes:
  qdrant_storage:
  neo4j_data:
  neo4j_logs:
