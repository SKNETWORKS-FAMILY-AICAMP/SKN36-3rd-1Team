<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="490" viewBox="0 0 1280 490"><rect width="1280" height="490" rx="26" fill="#F7F9FC"/><text x="44" y="68" font-size="32" font-family="Arial, sans-serif" font-weight="700" fill="#19314D">사용자 질문이 답변이 되기까지</text><text x="44" y="108" font-size="19" font-family="Arial, sans-serif" fill="#596B80">10개의 검색 청크에서 인용 가능한 근거를 골라 최대 5개만 답변에 사용</text><rect x="44" y="155" width="382" height="116" rx="18" fill="#E8F1FF" stroke="#CCD7E5" stroke-width="1.5"/><circle cx="84" cy="200" r="27" fill="#FFFFFF"/><text x="84" y="208" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" font-weight="700" fill="#205082">1</text><text x="126" y="202" font-size="25" font-family="Arial, sans-serif" font-weight="700" fill="#1A3555">질문 받기</text><text x="126" y="238" font-size="18" font-family="Arial, sans-serif" fill="#506783">FastAPI · 프로필 검사</text><rect x="448" y="155" width="382" height="116" rx="18" fill="#E8F1FF" stroke="#CCD7E5" stroke-width="1.5"/><circle cx="488" cy="200" r="27" fill="#FFFFFF"/><text x="488" y="208" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" font-weight="700" fill="#205082">2</text><text x="530" y="202" font-size="25" font-family="Arial, sans-serif" font-weight="700" fill="#1A3555">원문 찾기</text><text x="530" y="238" font-size="18" font-family="Arial, sans-serif" fill="#506783">Qdrant Top-10 검색</text><rect x="852" y="155" width="382" height="116" rx="18" fill="#FFF2E1" stroke="#CCD7E5" stroke-width="1.5"/><circle cx="892" cy="200" r="27" fill="#FFFFFF"/><text x="892" y="208" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" font-weight="700" fill="#205082">3</text><text x="934" y="202" font-size="25" font-family="Arial, sans-serif" font-weight="700" fill="#1A3555">조건 가져오기</text><text x="934" y="238" font-size="18" font-family="Arial, sans-serif" fill="#506783">Neo4j 정책 연결</text><rect x="44" y="293" width="382" height="116" rx="18" fill="#E8F7EE" stroke="#CCD7E5" stroke-width="1.5"/><circle cx="84" cy="338" r="27" fill="#FFFFFF"/><text x="84" y="346" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" font-weight="700" fill="#205082">4</text><text x="126" y="340" font-size="25" font-family="Arial, sans-serif" font-weight="700" fill="#1A3555">근거 고르기</text><text x="126" y="376" font-size="18" font-family="Arial, sans-serif" fill="#506783">Context 최대 5개</text><rect x="448" y="293" width="382" height="116" rx="18" fill="#E8F7EE" stroke="#CCD7E5" stroke-width="1.5"/><circle cx="488" cy="338" r="27" fill="#FFFFFF"/><text x="488" y="346" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" font-weight="700" fill="#205082">5</text><text x="530" y="340" font-size="25" font-family="Arial, sans-serif" font-weight="700" fill="#1A3555">조건·답변</text><text x="530" y="376" font-size="18" font-family="Arial, sans-serif" fill="#506783">Checker · Generator</text><rect x="852" y="293" width="382" height="116" rx="18" fill="#E8F1FF" stroke="#CCD7E5" stroke-width="1.5"/><circle cx="892" cy="338" r="27" fill="#FFFFFF"/><text x="892" y="346" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" font-weight="700" fill="#205082">6</text><text x="934" y="340" font-size="25" font-family="Arial, sans-serif" font-weight="700" fill="#1A3555">출처 검사</text><text x="934" y="376" font-size="18" font-family="Arial, sans-serif" fill="#506783">[n]과 정책 판정 일치</text><text x="44" y="452" font-size="18" font-family="Arial, sans-serif" fill="#53667E">정책의 접수 상태는 Checker가 판정하고, LLM이 만든 문장은 최종 검증을 통과해야 반환됩니다.</text></svg>