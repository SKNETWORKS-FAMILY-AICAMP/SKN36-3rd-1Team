<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="490" viewBox="0 0 1280 490"><rect width="1280" height="490" rx="26" fill="#F7F9FC"/><text x="44" y="68" font-size="32" font-family="Arial, sans-serif" font-weight="700" fill="#19314D">왜 출처 번호를 검증할까요?</text><text x="44" y="108" font-size="19" font-family="Arial, sans-serif" fill="#596B80">출처가 존재하더라도 다른 정책의 근거를 잘못 붙이면 안내 내용이 틀릴 수 있습니다.</text><rect x="44" y="155" width="382" height="116" rx="18" fill="#E8F1FF" stroke="#CCD7E5" stroke-width="1.5"/><circle cx="84" cy="200" r="27" fill="#FFFFFF"/><text x="84" y="208" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" font-weight="700" fill="#205082">A</text><text x="126" y="202" font-size="25" font-family="Arial, sans-serif" font-weight="700" fill="#1A3555">정책 A</text><text x="126" y="238" font-size="18" font-family="Arial, sans-serif" fill="#506783">접수 마감</text><rect x="448" y="155" width="382" height="116" rx="18" fill="#E8F1FF" stroke="#CCD7E5" stroke-width="1.5"/><circle cx="488" cy="200" r="27" fill="#FFFFFF"/><text x="488" y="208" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" font-weight="700" fill="#205082">B</text><text x="530" y="202" font-size="25" font-family="Arial, sans-serif" font-weight="700" fill="#1A3555">정책 B</text><text x="530" y="238" font-size="18" font-family="Arial, sans-serif" fill="#506783">접수 중</text><rect x="852" y="155" width="382" height="116" rx="18" fill="#FFF2E1" stroke="#CCD7E5" stroke-width="1.5"/><circle cx="892" cy="200" r="27" fill="#FFFFFF"/><text x="892" y="208" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" font-weight="700" fill="#205082">!</text><text x="934" y="202" font-size="25" font-family="Arial, sans-serif" font-weight="700" fill="#1A3555">잘못된 답변</text><text x="934" y="238" font-size="18" font-family="Arial, sans-serif" fill="#506783">A는 신청 가능 [B의 출처]</text><rect x="44" y="293" width="382" height="116" rx="18" fill="#E8F7EE" stroke="#CCD7E5" stroke-width="1.5"/><circle cx="84" cy="338" r="27" fill="#FFFFFF"/><text x="84" y="346" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" font-weight="700" fill="#205082">✓</text><text x="126" y="340" font-size="25" font-family="Arial, sans-serif" font-weight="700" fill="#1A3555">파이프라인 검사</text><text x="126" y="376" font-size="18" font-family="Arial, sans-serif" fill="#506783">A와 출처 정책 불일치</text><rect x="448" y="293" width="382" height="116" rx="18" fill="#E8F7EE" stroke="#CCD7E5" stroke-width="1.5"/><circle cx="488" cy="338" r="27" fill="#FFFFFF"/><text x="488" y="346" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" font-weight="700" fill="#205082">✓</text><text x="530" y="340" font-size="25" font-family="Arial, sans-serif" font-weight="700" fill="#1A3555">최종 안내</text><text x="530" y="376" font-size="18" font-family="Arial, sans-serif" fill="#506783">A는 접수 마감</text><rect x="852" y="293" width="382" height="116" rx="18" fill="#E8F1FF" stroke="#CCD7E5" stroke-width="1.5"/><circle cx="892" cy="338" r="27" fill="#FFFFFF"/><text x="892" y="346" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" font-weight="700" fill="#205082">✓</text><text x="934" y="340" font-size="25" font-family="Arial, sans-serif" font-weight="700" fill="#1A3555">정상 인용 유지</text><text x="934" y="376" font-size="18" font-family="Arial, sans-serif" fill="#506783">B의 올바른 설명 보존</text><text x="44" y="452" font-size="18" font-family="Arial, sans-serif" fill="#53667E">없는 출처 [999]는 502 오류, 앞자리 0이 붙은 [0001]은 [1]로 정규화합니다.</text></svg>